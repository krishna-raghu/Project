spring.application.name=demo_proj

# =========================
# NEO4J
# =========================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=test123_demo

# =========================
# POSTGRES
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/dependency_graph
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

# =========================
# SWAGGER
# ========================
# Change the path from /swagger-ui/index.html to just /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Sort the endpoints alphabetically by HTTP method (GET, POST, etc.)
springdoc.swagger-ui.operationsSorter=alpha
