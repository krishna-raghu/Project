spring.application.name=demo_proj

# ==================================
# NEO4J CONFIGURATION
# ==================================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=test123_demo

# ==================================
# SUPABASE POSTGRESQL CONNECTION
# ==================================
spring.datasource.url=jdbc:postgresql://db.ypzerrmfawiuvbmowakd.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=finalYR@2026project
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================
# JPA / HIBERNATE SETTINGS
# ==================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================================
# SERVER SETTINGS
# ==================================
server.port=8080

# ==================================
# OAUTH2 RESOURCE SERVER (SUPABASE)
# ==================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://db.ypzerrmfawiuvbmowakd.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://db.ypzerrmfawiuvbmowakd.supabase.co/auth/v1/certs

# ==================================
# SWAGGER IMPLEMENTATION
# ==================================
# Custom path for the Swagger HTML UI
springdoc.swagger-ui.path=/swagger-ui.html

# Custom path for the raw OpenAPI JSON doc
springdoc.api-docs.path=/api-docs

# Sort endpoints by HTTP Method (GET, POST, PUT, DELETE, etc.)
springdoc.swagger-ui.operationsSorter=method
