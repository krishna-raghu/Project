spring:
  application:
    name: nervix-backend
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_schema: nervix
  flyway:
    enabled: true
    schemas: nervix
    default-schema: nervix
    create-schemas: true
    baseline-on-migrate: false

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    neo4j:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

nervix:
  cors:
    allowed-origins: http://localhost:5173
  tenancy:
    default-organization-name: Nervix Workspace
    default-organization-slug: default
