<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nervix Home</title>
</head>

<body>
<div style="display:flex; justify-content:flex-end;">

    <button id="profileBtn">
        👤 Profile
    </button>

</div>

<h1>Nervix Home</h1>

<button id="newCollectionBtn">
    Add New Collection
</button>

<button id="existingCollectionBtn">
    Sign In To Existing Collection
</button>

<hr>

<h2>Existing Collections</h2>

<ul id="collectionList"></ul>

<!-- NEW COLLECTION POPUP -->

<div id="newPopup" style="display:none; border:1px solid black; padding:20px; margin-top:20px;">

    <h2>Create New Collection</h2>

    <label>Project Name</label><br>
    <input type="text" id="projectName"><br><br>

    <label>Set Password</label><br>
    <input type="password" id="newPassword"><br><br>

    <label>Confirm Password</label><br>
    <input type="password" id="confirmPassword"><br><br>

    <label>Collaborator Emails</label><br>
    <textarea id="emails"></textarea><br><br>

    <label>Project Type</label><br>

    <select id="projectType">

        <option value="Individual">
            Individual
        </option>

        <option value="Team">
            Team
        </option>

    </select>

    <br><br>

    <button id="createCollectionBtn">
        Enter
    </button>

    <button id="closeNewPopup">
        Close
    </button>

</div>

<!-- EXISTING COLLECTION POPUP -->

<div id="existingPopup" style="display:none; border:1px solid black; padding:20px; margin-top:20px;">

    <h2>Open Existing Collection</h2>

    <label>Collection Name</label><br>
    <input type="text" id="existingCollectionName"><br><br>

    <label>Password</label><br>
    <input type="password" id="existingPassword"><br><br>

    <button id="enterExistingBtn">
        Enter
    </button>

    <button id="closeExistingPopup">
        Close
    </button>

</div>

<script src="homePage.js"></script>


</body>
</html>
